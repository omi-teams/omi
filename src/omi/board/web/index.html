<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Theo dõi dự án, kế hoạch và tiến độ công việc cùng omi board.">
<title>omi board</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Bỏ qua đến nội dung</a>
<header class="top">
  <div class="bar">
    <button id="sidebar-toggle" class="btn" type="button" aria-controls="board-sidebar" aria-expanded="false">Chức năng</button>
    <a class="brand" href="#/"><svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle></svg>omi board</a>
    <a id="inbox-link" href="#/inbox">Hộp thư PO <span id="inbox-count">—</span></a>
    <span id="source" class="mono muted small"></span>
    <nav id="nav" class="crumb" aria-label="Điều hướng"></nav>
    <div class="tools">
      <span id="status" class="updated" role="status"></span>
      <button class="btn" type="button" id="refresh" aria-label="Làm mới"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg><span class="refresh-text">Làm mới</span></button>
    </div>
  </div>
  <nav id="board-sidebar" aria-label="Chức năng board" hidden><ul id="sidebar-links"></ul></nav>
</header>
<button id="sidebar-backdrop" type="button" aria-label="Đóng thanh chức năng" tabindex="-1" hidden></button>
<main id="main" class="wrap" tabindex="-1">
  <div id="err" role="alert"></div>
  <div id="view" tabindex="-1"><h1 id="title" tabindex="-1">Đang tải…</h1></div>
</main>
<script src="dom.js"></script>
<script src="tree.js"></script>
<script src="dashboard.js"></script>
<script src="task.js"></script>
<script src="inbox.js"></script>
<script src="graph.js"></script>
<script src="app.js"></script>
</body>
</html>
