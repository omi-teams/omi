name: CI

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package
        run: pip install .

      - name: Run tests
        run: python tests/test_omi.py
