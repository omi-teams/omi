[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omi-squad"
version = "0.4.1"
description = "Run a small, quota-frugal squad of AI coding agents inside your project."
requires-python = ">=3.13"

[project.scripts]
omi = "omi:main"

[tool.setuptools.package-data]
omi = ["template_shas.json", "template/*", "template/**/*", "template/**/.*"]

[tool.setuptools.exclude-package-data]
omi = ["**/__pycache__/*", "*.pyc"]
